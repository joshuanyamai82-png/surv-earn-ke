<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>SurveyEarn - Help Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .search-box { margin-bottom:24px; }
  .search-box input { width:100%; padding:14px 20px; border-radius:40px; border:1px solid #eef2f6; background:#fff; font-size:16px; outline:none; transition:.2s; }
  .search-box input:focus { border-color:#4f46e5; }
  .categories { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
  .category { padding:8px 20px; background:#fff; border-radius:40px; font-size:14px; font-weight:500; cursor:pointer; border:1px solid #eef2f6; transition:.2s; }
  .category.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
  .faq-list { margin-bottom:32px; }
  .faq-item { background:#fff; border-radius:20px; margin-bottom:12px; overflow:hidden; border:1px solid #eef2f6; }
  .faq-question { padding:20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:500; }
  .faq-answer { padding:0 20px 20px; color:#6b7280; line-height:1.5; display:none; }
  .faq-item.active .faq-answer { display:block; }
  .support-cta { background:linear-gradient(135deg,#4f46e5,#f97316); border-radius:24px; padding:32px; color:#fff; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .support-cta button { background:#fff; border:none; padding:12px 24px; border-radius:40px; font-weight:600; color:#4f46e5; cursor:pointer; }
  @media (max-width:768px) {
    .search-box input { padding:12px 16px; font-size:14px; }
    .category { padding:6px 14px; font-size:12px; }
    .faq-question { padding:16px; font-size:14px; }
    .faq-answer { padding:0 16px 16px; font-size:13px; }
    .support-cta { padding:24px; flex-direction:column; text-align:center; }
  }
</style>
</head>
<body>
  <div class="sidebar" id="shellSidebar"></div>
  <div class="main">
    <div class="topbar" id="shellTopbar"></div>
    <div class="content">
      <div id="shellMobileBalance"></div>

      <div class="search-box"><input type="text" id="searchInput" placeholder="Search for answers..."></div>
      <div class="categories" id="categoriesContainer">
        <div class="category active" data-category="all">All</div>
        <div class="category" data-category="getting-started">Getting Started</div>
        <div class="category" data-category="earnings">Earnings</div>
        <div class="category" data-category="survey-taking">Survey Taking</div>
        <div class="category" data-category="account">Account</div>
        <div class="category" data-category="referrals">Referrals</div>
        <div class="category" data-category="technical">Technical</div>
        <div class="category" data-category="payments">Payments</div>
      </div>
      <div class="faq-list" id="faqList"></div>
      <div class="support-cta">
        <div><h3>Still need help?</h3><p>Our support team is here to assist you</p></div>
        <button id="contactSupportBtn">Contact Support</button>
      </div>
    </div>
  </div>
  <div class="bottom-nav" id="shellBottomNav"></div>
  <div id="shellModals"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
  <script type="module">
    import { renderShell, showToast, updateShellUser } from './shared/ui.js';
    import { requireAuth } from './shared/auth.js';
    import { MIN_WITHDRAWAL, ACTIVATION_FEE } from './shared/config.js';

    const user = requireAuth('login.html');
    if (user) {
      renderShell({ activePage: 'help', title: 'Help Center', subtitle: 'Find answers or contact support' });
      updateShellUser(user);
      renderFAQs();
      initCategories();
    }

    const faqData = [
      { category:'getting-started', question:'How do I start taking surveys?', answer:'Log in and go to the Surveys page. Click "Take Survey" on any available survey and follow the instructions. Earnings are added automatically upon completion.' },
      { category:'getting-started', question:'What are the requirements to join SurveyEarn?', answer:'Anyone aged 18+ with a valid email address can join. Registration is free and takes less than 2 minutes.' },
      { category:'earnings', question:'How much can I earn per survey?', answer:'Survey rewards vary. Free surveys offer up to Ksh 3,360, standard surveys up to Ksh 5,310, and premium surveys up to Ksh 7,080 per survey.' },
      { category:'payments', question:'When and how can I withdraw my earnings?', answer:`Minimum withdrawal is Ksh ${MIN_WITHDRAWAL}. One-time activation fee of Ksh ${ACTIVATION_FEE} applies to your first withdrawal. Payments are processed within 24-48 hours via M-Pesa.` },
      { category:'survey-taking', question:'Why is there a delay between questions?', answer:'A short delay is used to prevent random clicking and ensure thoughtful responses. It helps maintain data quality.' },
      { category:'technical', question:'What happens if I lose internet connection during a survey?', answer:'If you reconnect within a few minutes, you may be able to resume. Otherwise, the survey may be lost. Use a stable connection before starting.' },
      { category:'account', question:'How do I update my profile information?', answer:'Go to Settings and edit your details. Keep your profile complete to receive relevant surveys.' },
      { category:'account', question:'Can I have multiple accounts?', answer:'No, each user is allowed only one account. Duplicate accounts may result in suspension.' },
      { category:'referrals', question:'How does the referral program work?', answer:'Share your unique referral code. When a friend signs up and completes their first survey, you both earn Ksh 200.' }
    ];

    function renderFAQs(category = 'all', searchTerm = '') {
      const c = document.getElementById('faqList');
      let items = faqData;
      if (category !== 'all') items = items.filter(f => f.category === category);
      if (searchTerm.trim()) {
        const t = searchTerm.toLowerCase();
        items = items.filter(f => f.question.toLowerCase().includes(t) || f.answer.toLowerCase().includes(t));
      }
      if (!items.length) {
        c.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>No matching questions found.</p></div>`;
        return;
      }
      c.innerHTML = items.map(f => `
        <div class="faq-item"><div class="faq-question">${f.question}<i class="fas fa-chevron-down"></i></div><div class="faq-answer">${f.answer}</div></div>`).join('');
      c.querySelectorAll('.faq-item').forEach(el => {
        el.querySelector('.faq-question').addEventListener('click', () => el.classList.toggle('active'));
      });
    }

    function initCategories() {
      document.querySelectorAll('.category').forEach(cat => {
        cat.addEventListener('click', () => {
          document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
          cat.classList.add('active');
          renderFAQs(cat.getAttribute('data-category'), document.getElementById('searchInput').value);
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      const cat = document.querySelector('.category.active').getAttribute('data-category');
      renderFAQs(cat, e.target.value);
    });

    document.getElementById('contactSupportBtn').addEventListener('click', () => {
      showToast('Support request sent! We will get back to you within 24 hours.', 4000);
    });
  </script>
</body>
</html>
